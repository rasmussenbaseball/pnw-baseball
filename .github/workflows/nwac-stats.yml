name: NWAC + Willamette + Seattle U Stats Scraper

on:
  # PAUSED for 2026 offseason — NWAC season ended May 25, 2026.
  # Re-enable the `schedule:` block when 2027 season starts. Also note:
  # this workflow runs recalculate_league_adjusted.py at the end, which
  # IS still useful during the offseason to keep league averages fresh
  # as D1 finishes. If you want league recalc only (no NWAC scrape) you
  # can trigger this workflow manually via the Actions tab.
  # schedule:
  #   # Run daily at 8 PM Pacific (3 AM UTC next day, during PDT/daylight saving).
  #   # Scheduled 1 hour AFTER the server's 7 PM Pacific daily_update.sh so that
  #   # recalculate_league_adjusted.py (this workflow's final step) sees fresh
  #   # D1/D2/D3/NAIA stats from the server AND fresh NWAC stats from this run.
  #   # Note: during PST (November to mid-March) this effectively runs at 7 PM
  #   # Pacific, which is still after the server's 7 PM run finishes, so fine.
  #   # ~120 ScraperAPI credits per run x 30 days = ~3,600/month (within 5,000 free tier)
  #   - cron: '0 3 * * *'
  workflow_dispatch:  # Allow manual runs
    inputs:
      season:
        description: 'Season year (e.g. 2027). Blank = derived from today''s date; the 2026-27 style string is derived from it.'
        required: false
        default: ''
      team:
        description: 'Team group to scrape (nwac, willamette, seattle-u, or blank for all)'
        required: false
        default: ''

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4 psycopg2-binary python-dotenv

      # Season = dispatch input when given, otherwise derived from today's date
      # by scripts/season_utils.py (calendar year through August, next year
      # from September on). PRESTO_SEASON is the matching "2026-27" style
      # academic-year string that scrape_nwac.py expects.
      - name: Resolve season
        run: |
          SEASON="${{ github.event.inputs.season }}"
          if [ -z "$SEASON" ]; then
            SEASON="$(python3 -c "import sys; sys.path.insert(0,'scripts'); from season_utils import scrape_season; print(scrape_season())")"
          fi
          PRESTO_SEASON="$(python3 -c "import sys; sys.path.insert(0,'scripts'); from season_utils import presto_season_str; print(presto_season_str($SEASON))")"
          echo "Season: $SEASON ($PRESTO_SEASON)"
          echo "SEASON=$SEASON" >> "$GITHUB_ENV"
          echo "PRESTO_SEASON=$PRESTO_SEASON" >> "$GITHUB_ENV"

      # Runs BEFORE the scrape: scrape_nwac.py ends by reconciling pitching_stats
      # against game_pitching sums, and duplicate game rows would inflate those
      # sums (this is how 2026 batters_faced got corrupted).
      - name: Deduplicate games
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          cd $GITHUB_WORKSPACE
          PYTHONPATH=backend python3 scripts/dedup_games.py --season "$SEASON"

      - name: Scrape stats
        env:
          SCRAPER_API_KEY: ${{ secrets.SCRAPER_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          cd $GITHUB_WORKSPACE
          TEAM_FLAG="${{ github.event.inputs.team }}"
          if [ -n "$TEAM_FLAG" ]; then
            PYTHONPATH=backend python3 scripts/scrape_nwac.py --season "$PRESTO_SEASON" --skip-rosters --team "$TEAM_FLAG"
          else
            PYTHONPATH=backend python3 scripts/scrape_nwac.py --season "$PRESTO_SEASON" --skip-rosters
          fi

      - name: Recalculate league-adjusted stats
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          cd $GITHUB_WORKSPACE
          PYTHONPATH=backend python3 scripts/recalculate_league_adjusted.py --season "$SEASON"
